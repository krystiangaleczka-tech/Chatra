name: Chatra domain, migrations and HD
on:
  push:
    branches: [main]
    paths: ["android/**", "backend/**", "scripts/ch006_compare_screens.py", "scripts/ch055_*", "scripts/ch057_*", "scripts/ch072_*", "scripts/ch062_*", "scripts/ch064_*", ".github/workflows/chatra-verification.yml"]
  pull_request:
    paths: ["android/**", "backend/**", "scripts/ch006_compare_screens.py", "scripts/ch055_*", "scripts/ch057_*", "scripts/ch072_*", "scripts/ch062_*", "scripts/ch064_*", ".github/workflows/chatra-verification.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest -q --junitxml=results.xml
        working-directory: backend
      - name: Verify published OpenAPI
        working-directory: backend
        run: python -c 'import json; from api import create_app; assert json.load(open("openapi.json")) == create_app(None).openapi()'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results
          path: backend/results.xml
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # Legacy `tools` was removed from the Android SDK repository.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.1.0"
      - run: ./gradlew :core:model:test :core:testing:test :core:designsystem:testDebugUnitTest :app:testDemoDebugUnitTest :app:testFullDebugUnitTest :app:assembleDemoDebug :app:assembleFullDebug :app:lintFullDebug :app:lintDemoDebug
        working-directory: android
      - name: Build and verify the offline beta APK
        env:
          ORG_GRADLE_PROJECT_chatraBackendOrigin: https://beta-config-check.invalid
          ORG_GRADLE_PROJECT_chatraHdPilot: 'true'
          ORG_GRADLE_PROJECT_chatraPlayProduct: qa.config-check
          ORG_GRADLE_PROJECT_chatraFirebaseApiKey: qa-firebase-key
          ORG_GRADLE_PROJECT_chatraFirebaseApplicationId: '1:123456789:android:0123456789abcdef'
          ORG_GRADLE_PROJECT_chatraFirebaseSenderId: '123456789'
          ORG_GRADLE_PROJECT_chatraFirebaseProjectId: qa-config-check
        run: bash scripts/ch062_build_beta.sh
      - name: Build signed release for QA
        run: bash scripts/ch064_build_release_qa.sh
      - name: Check signed release for 16 KiB page alignment
        run: |
          bash scripts/ch064_check_page_alignment.sh build/release-qa/chatra-release-qa.apk build/release-qa/chatra-release-qa.aab \
            > build/release-qa/PAGE_ALIGNMENT.txt
          cat build/release-qa/PAGE_ALIGNMENT.txt
      - name: Rebuild the previous Android version for rollback QA
        run: bash scripts/ch062_build_rollback.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image comparison dependency
        run: python3 -m pip install "Pillow==13.0.0"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        id: emulator16
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          working-directory: android
          disable-animations: true
          script: bash ../scripts/ch062_emulator_checks.sh --verify-beta --verify-release --verify-rollback
      - name: Check Android 17 transport API
        if: ${{ !cancelled() && steps.emulator16.conclusion != 'skipped' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          arch: x86_64
          target: google_apis
          working-directory: android
          disable-animations: true
          script: bash ../scripts/ch072_emulator_probe.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            android/**/build/reports/tests/**
            android/**/build/reports/androidTests/**
            android/**/build/test-results/**
            android/**/build/outputs/androidTest-results/**
            android/app/build/reports/lint-results-fullDebug.html
            android/app/build/reports/lint-results-demoDebug.html
            android/app/build/reports/ui/**
      - uses: actions/upload-artifact@v4
        with:
          name: chatra-offline-beta
          path: build/beta/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: chatra-release-qa
          path: build/release-qa/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: chatra-debug-apks
          if-no-files-found: error
          path: android/app/build/outputs/apk/**/*.apk
