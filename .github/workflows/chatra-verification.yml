name: Chatra domain, migrations and HD
on:
  push:
    paths: ["android/**", "backend/**", ".github/workflows/chatra-verification.yml"]
  pull_request:
    paths: ["android/**", "backend/**", ".github/workflows/chatra-verification.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest -q --junitxml=results.xml
        working-directory: backend
      - name: Verify published OpenAPI
        working-directory: backend
        run: python -c 'import json; from api import create_app; assert json.load(open("openapi.json")) == create_app(None).openapi()'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results
          path: backend/results.xml
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-37" "build-tools;36.1.0"
      - run: ./gradlew :core:model:test :core:testing:test :app:testDemoDebugUnitTest :app:testFullDebugUnitTest :app:assembleDemoDebug :app:assembleFullDebug :app:lintFullDebug
        working-directory: android
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          working-directory: android
          disable-animations: true
          script: |
            ./gradlew :app:installFullDebug
            adb shell cmd role add-role-holder --user 0 android.app.role.SMS app.chatra
            adb shell pm grant app.chatra android.permission.READ_SMS
            adb shell pm grant app.chatra android.permission.SEND_SMS
            adb shell pm grant app.chatra android.permission.READ_PHONE_STATE
            adb shell pm grant app.chatra android.permission.POST_NOTIFICATIONS
            ./gradlew :core:database:connectedDebugAndroidTest :app:connectedFullDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            android/**/build/reports/tests/**
            android/**/build/reports/androidTests/**
            android/app/build/reports/lint-results-fullDebug.html
