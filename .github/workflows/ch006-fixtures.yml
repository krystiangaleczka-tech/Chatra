name: CH006 reference fixtures
on:
  push:
    paths:
      - "scripts/ch006_*"
      - "docs/implementacja_android/Chatra_Pakiet_referencyjny/style_zrodlowe.json"
      - ".github/workflows/ch006-fixtures.yml"
  pull_request:
    paths:
      - "scripts/ch006_*"
      - "docs/implementacja_android/Chatra_Pakiet_referencyjny/style_zrodlowe.json"
      - ".github/workflows/ch006-fixtures.yml"
jobs:
  validate-reference-fixtures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify original 10 screen fixtures
        run: |
          node scripts/ch006_verify_fixtures.mjs
          node scripts/ch006_build_fixtures.mjs
          node scripts/ch006_build_fixtures.mjs --verify
      - name: Validate image comparison on synthetic PNGs
        run: |
          python -m pip install "Pillow>=12,<15"
          python scripts/ch006_test_compare.py
